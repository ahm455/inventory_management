version: "3.9"

services:

  web:
    build: .
    command: >
      gunicorn inventory_management.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6380:6379"
  celery:
    build: .
    command: celery -A inventory_management worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  celery-beat:
    build: .
    command: celery -A inventory_management beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis